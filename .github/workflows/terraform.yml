name: Terraform CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub OIDC context
        run: |
          echo "======================================"
          echo "GitHub OIDC DEBUG"
          echo "======================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Repository Owner ID: ${{ github.repository_owner_id }}"
          echo "Repository Owner: ${{ github.repository_owner }}"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "======================================"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::148598146690:role/GitHubActions-Terraform-Role
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        if: github.event_name == 'push'
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        if: github.event_name == 'push'
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'push'
        run: terraform plan