name: AWS OIDC Debug

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get OIDC token information
        shell: bash
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "OIDC token request URL exists: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC token request token exists: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"