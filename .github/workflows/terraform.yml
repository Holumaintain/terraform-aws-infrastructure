name: AWS OIDC Claims

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  inspect-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC token
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)

          echo "$PAYLOAD" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          print("======================================")
          print("OIDC CLAIMS")
          print("======================================")
          print("iss:", data.get("iss"))
          print("aud:", data.get("aud"))
          print("sub:", data.get("sub"))
          print("repository:", data.get("repository"))
          print("repository_id:", data.get("repository_id"))
          print("repository_owner:", data.get("repository_owner"))
          print("repository_owner_id:", data.get("repository_owner_id"))
          print("ref:", data.get("ref"))
          print("======================================")
          '